name: Sync content

on:
  push:
    branches: [main]
    # content/manifest.js مولَّد ولا يُعيد تشغيل الـ workflow (لا حلقة لا نهائية)
    paths: ["content/ar/**", "content/en/**", "js/config.js", "scripts/generate.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-content
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Generate manifest / sitemap / feeds
        run: node scripts/generate.mjs
      - name: Commit generated files
        run: |
          git config user.name  "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/manifest.js sitemap.xml feed.xml feed-en.xml
          if git diff --cached --quiet; then
            echo "No changes to generated files."
          else
            git commit -m "chore: sync generated content"
            git push
          fi
